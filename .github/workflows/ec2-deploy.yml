name: Deploy Static Website to EC2
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$EC2_SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/amrit.pem
          chmod 600 ~/.ssh/amrit.pem
          ssh-keygen -y -f ~/.ssh/amrit.pem > /dev/null || { echo "EC2_SSH_KEY secret is not a valid private key"; exit 1; }
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/amrit.pem "ec2-user@$EC2_HOST" 'bash -se' <<'EOF'
          APP="/home/ec2-user/ec2-webapp"
          if [ -d "$APP/.git" ]; then
            cd "$APP"
            git checkout main
            git pull --ff-only origin main
          else
            git clone -b main "https://github.com/${{ github.repository }}.git" "$APP"
          fi
          EOF